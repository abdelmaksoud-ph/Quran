<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="description" content="استمع إلى القرآن الكريم كاملاً بصوت الشيخ مشاري بن راشد العفاسي">
<title>القرآن الكريم | مشاري العفاسي</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☪️</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@300;500;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b1020;--lapis:#16264a;--gold:#d9b45a;--gold2:#f0d58a;--paper:#f3ead7;--mute:#9aa3bd;--line:rgba(217,180,90,.18);--card:rgba(22,38,74,.45)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--paper);font-family:'Cairo',sans-serif;min-height:100vh;overflow-x:hidden;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}

/* Hero */
.hero{position:relative;text-align:center;padding:clamp(48px,10vh,110px) 5% 40px;isolation:isolate}
.star{position:absolute;top:50%;left:50%;width:min(720px,140vw);aspect-ratio:1;transform:translate(-50%,-50%);z-index:-1;opacity:.55;animation:spin 120s linear infinite;animation-play-state:paused}
body.playing .star{animation-play-state:running}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 50%,transparent 20%,var(--ink) 70%)}
.hero h1{font-family:'Reem Kufi',sans-serif;font-weight:700;font-size:clamp(3.2rem,12vw,7rem);line-height:1.1;color:var(--gold2);text-shadow:0 0 60px rgba(217,180,90,.35)}
.hero p{margin-top:12px;color:var(--mute);font-size:clamp(1rem,2.6vw,1.25rem);font-weight:300}
.hero p b{color:var(--paper);font-weight:500}

/* Controls */
.tools{max-width:760px;margin:0 auto 36px;padding:0 5%;display:grid;gap:16px}
.search{width:100%;padding:15px 24px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--paper);font:inherit;font-size:1.05rem;backdrop-filter:blur(8px)}
.search::placeholder{color:var(--mute)}
.search:focus{outline:none;border-color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{padding:7px 18px;border-radius:99px;border:1px solid var(--line);color:var(--mute);font-size:.95rem;transition:.2s}
.chip[aria-pressed=true]{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.count{text-align:center;color:var(--mute);font-size:.85rem}

/* Grid: cards are mihrab-shaped (arched top) */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:16px;padding:0 5%;max-width:1300px;margin:0 auto}
.card{position:relative;text-align:center;padding:34px 14px 20px;background:var(--card);border:1px solid var(--line);border-radius:90px 90px 14px 14px;transition:transform .25s,border-color .25s,background .25s}
.card:hover{transform:translateY(-4px);border-color:var(--gold)}
.card .no{display:grid;place-items:center;width:38px;height:38px;margin:0 auto 10px;border:1px solid var(--gold);transform:rotate(45deg);border-radius:6px;color:var(--gold)}
.card .no span{transform:rotate(-45deg);font-size:.85rem;font-weight:700}
.card h3{font-family:'Amiri',serif;font-size:1.85rem;line-height:1.3;color:var(--paper)}
.card small{color:var(--mute);font-size:.8rem}
.card.on{background:linear-gradient(var(--lapis),rgba(217,180,90,.14));border-color:var(--gold2);box-shadow:0 0 36px rgba(217,180,90,.2)}
.card.on h3{color:var(--gold2)}
.fav{position:absolute;top:10px;left:10px;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;color:var(--mute);font-size:1.1rem}
.fav[aria-pressed=true]{color:var(--gold2)}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:60px 0}

/* Player */
.player{position:fixed;inset-inline:0;bottom:0;z-index:50;padding:12px 4% calc(12px + env(safe-area-inset-bottom));background:rgba(11,16,32,.9);backdrop-filter:blur(18px);border-top:1px solid var(--gold);transform:translateY(110%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.player.show{transform:none}
.pin{max-width:900px;margin:auto;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:16px}
.now{font-family:'Amiri',serif;font-size:1.4rem;color:var(--gold2);white-space:nowrap}
.mid{display:grid;gap:4px;min-width:0}
.seek{width:100%;accent-color:var(--gold);height:18px}
.times{display:flex;justify-content:space-between;font-size:.75rem;color:var(--mute);direction:ltr}
.btns{display:flex;align-items:center;gap:6px}
.btns button{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--paper)}
.btns button:hover{color:var(--gold2)}
.btns .pp{width:50px;height:50px;background:var(--gold);color:var(--ink)}
.btns .pp:hover{color:var(--ink);background:var(--gold2)}
svg.i{width:22px;height:22px;fill:currentColor}
@media(max-width:620px){.pin{grid-template-columns:1fr auto;grid-template-areas:"n b" "m m"}.now{grid-area:n}.btns{grid-area:b}.mid{grid-area:m}.btns button{width:36px;height:36px}.btns .pp{width:46px;height:46px}}

footer{margin-top:70px;padding:36px 5%;text-align:center;color:var(--mute);border-top:1px solid var(--line);font-size:.9rem}
footer b{color:var(--gold)}

/* Loader */
#load{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--ink);transition:opacity .6s}
#load.off{opacity:0;pointer-events:none}
#load svg{width:90px;animation:spin2 3s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.err{color:var(--gold2);text-align:center;padding:40px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="khatam" viewBox="0 0 200 200"><g fill="none" stroke="#d9b45a" stroke-width=".8">
    <rect x="40" y="40" width="120" height="120"/><rect x="40" y="40" width="120" height="120" transform="rotate(45 100 100)"/>
    <rect x="58" y="58" width="84" height="84"/><rect x="58" y="58" width="84" height="84" transform="rotate(45 100 100)"/>
    <circle cx="100" cy="100" r="62"/><circle cx="100" cy="100" r="30"/><circle cx="100" cy="100" r="95" stroke-dasharray="2 5"/></g></symbol>
</defs></svg>

<div id="load"><svg><use href="#khatam"/></svg></div>

<header class="hero">
  <svg class="star" aria-hidden="true"><use href="#khatam"/></svg>
  <h1>القرآن الكريم</h1>
  <p>بصوت الشيخ <b>مشاري بن راشد العفاسي</b></p>
</header>

<section class="tools">
  <input id="q" class="search" type="search" placeholder="ابحث باسم السورة أو رقمها" aria-label="بحث عن سورة" autocomplete="off">
  <div class="chips" id="chips">
    <button class="chip" data-f="all" aria-pressed="true">الكل</button>
    <button class="chip" data-f="1" aria-pressed="false">مكية</button>
    <button class="chip" data-f="0" aria-pressed="false">مدنية</button>
    <button class="chip" data-f="fav" aria-pressed="false">المفضلة</button>
  </div>
  <div class="count" id="count" aria-live="polite"></div>
</section>

<main class="grid" id="grid"></main>

<div class="player" id="player" role="region" aria-label="مشغّل الصوت">
  <div class="pin">
    <div class="now" id="now"></div>
    <div class="mid">
      <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="موضع التشغيل">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="btns">
      <button id="next" aria-label="السورة التالية"><svg class="i" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" transform="matrix(-1 0 0 1 24 0)"/></svg></button>
      <button class="pp" id="pp" aria-label="تشغيل / إيقاف"></button>
      <button id="prev" aria-label="السورة السابقة"><svg class="i" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button id="close" aria-label="إغلاق"><svg class="i" viewBox="0 0 24 24"><path d="M19 6.4 17.6 5 12 10.6 6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6z"/></svg></button>
    </div>
  </div>
</div>

<footer>
  <p>تم التطوير بواسطة <b>Mostafa S. Abd El-Maksoud</b></p>
  <p style="opacity:.6;margin-top:6px">© 2026 جميع الحقوق محفوظة لخدمة كتاب الله</p>
</footer>

<audio id="audio" preload="none"></audio>

<script>
const $ = id => document.getElementById(id);
const audio = $('audio'), grid = $('grid');
const ICON = {
  play: '<svg class="i" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg class="i" viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>'
};
let surahs = [], server = '', cur = null, filter = 'all';
let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem('favs') || '[]')); } catch (e) {}

const fmt = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '0:00';
const norm = s => s.replace(/[\u064B-\u0652\u0640]/g, '').replace(/[إأآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي');

async function init() {
  try {
    const [m, r] = await Promise.all([
      fetch('https://mp3quran.net/api/v3/suwar?language=ar').then(x => x.json()),
      fetch('https://mp3quran.net/api/v3/reciters?language=ar&reciter=123').then(x => x.json())
    ]);
    const mo = r.reciters[0].moshaf.find(x => x.surah_total === 114) || r.reciters[0].moshaf[0];
    server = mo.server;
    const ids = mo.surah_list.split(',');
    surahs = m.suwar.filter(s => ids.includes(String(s.id)));
    render();
  } catch (e) {
    grid.innerHTML = '<div class="err" style="grid-column:1/-1">تعذّر تحميل السور. تحقق من الاتصال ثم أعد تحميل الصفحة.</div>';
  }
  $('load').classList.add('off');
}

function visible() {
  const q = norm($('q').value.trim());
  return surahs.filter(s =>
    (filter === 'all' || (filter === 'fav' ? favs.has(s.id) : String(s.makkia) === filter)) &&
    (!q || norm(s.name).includes(q) || String(s.id) === q));
}

function render() {
  const list = visible();
  $('count').textContent = list.length + ' سورة';
  if (!list.length) { grid.innerHTML = '<div class="empty">لا توجد سور مطابقة. جرّب كلمة أخرى.</div>'; return; }
  grid.innerHTML = list.map(s => `
    <div class="card${cur && cur.id === s.id ? ' on' : ''}" data-id="${s.id}" role="button" tabindex="0" aria-label="تشغيل سورة ${s.name}">
      <button class="fav" data-fav="${s.id}" aria-pressed="${favs.has(s.id)}" aria-label="إضافة إلى المفضلة">${favs.has(s.id) ? '★' : '☆'}</button>
      <div class="no"><span>${s.id}</span></div>
      <h3>${s.name}</h3>
      <small>${s.makkia === 1 ? 'مكية' : 'مدنية'}</small>
    </div>`).join('');
}

grid.addEventListener('click', e => {
  const f = e.target.closest('[data-fav]');
  if (f) {
    const id = +f.dataset.fav;
    favs.has(id) ? favs.delete(id) : favs.add(id);
    try { localStorage.setItem('favs', JSON.stringify([...favs])); } catch (e) {}
    render(); return;
  }
  const c = e.target.closest('.card');
  if (c) play(surahs.find(s => s.id === +c.dataset.id));
});
grid.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')) {
    e.preventDefault(); play(surahs.find(s => s.id === +e.target.dataset.id));
  }
});

$('q').addEventListener('input', render);
$('chips').addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c === b));
  render();
});

function play(s) {
  if (!s) return;
  cur = s;
  audio.src = server + String(s.id).padStart(3, '0') + '.mp3';
  $('now').textContent = 'سورة ' + s.name;
  $('player').classList.add('show');
  audio.play().catch(() => {});
  render();
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'سورة ' + s.name, artist: 'مشاري بن راشد العفاسي', album: 'القرآن الكريم' });
  }
}
const step = d => {
  if (!cur) return;
  const i = surahs.findIndex(s => s.id === cur.id) + d;
  if (i >= 0 && i < surahs.length) play(surahs[i]);
};

$('pp').onclick = () => audio.paused ? audio.play() : audio.pause();
$('next').onclick = () => step(1);
$('prev').onclick = () => step(-1);
$('close').onclick = () => { audio.pause(); cur = null; $('player').classList.remove('show'); render(); };
audio.onplay = () => { $('pp').innerHTML = ICON.pause; document.body.classList.add('playing'); };
audio.onpause = () => { $('pp').innerHTML = ICON.play; document.body.classList.remove('playing'); };
audio.onended = () => step(1);
audio.ontimeupdate = () => {
  $('cur').textContent = fmt(audio.currentTime);
  if (audio.duration) $('seek').value = audio.currentTime / audio.duration * 100;
};
audio.onloadedmetadata = () => $('dur').textContent = fmt(audio.duration);
$('seek').oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration; };
$('pp').innerHTML = ICON.play;

if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('nexttrack', () => step(1));
  navigator.mediaSession.setActionHandler('previoustrack', () => step(-1));
}
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || !cur) return;
  if (e.code === 'Space' && e.target.tagName !== 'BUTTON' && !e.target.classList.contains('card')) { e.preventDefault(); $('pp').click(); }
});

init();
</script>
</body>
</html>
